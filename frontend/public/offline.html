<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RetailIQ - Offline</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #0b1220; color: #e2e8f0; padding: 24px; box-sizing: border-box; }
    .card { max-width: 420px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: #94a3b8; line-height: 1.6; }
    button { margin-top: 16px; background: #0f766e; color: white; border: 0; border-radius: 10px; padding: 12px 22px;
             font-size: 1rem; cursor: pointer; min-height: 44px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/favicon.svg" alt="RetailIQ logo" />
    <h1>You're offline</h1>
    <p>RetailIQ needs a connection to load live business data. Your data is safe; reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
