server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 30m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # API -> FastAPI container
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }
  location /docs { proxy_pass http://backend:8000; }
  location /redoc { proxy_pass http://backend:8000; }

  # Hashed build assets can be cached forever
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # The service worker and manifest must always be revalidated
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Single-page app: unknown paths -> index.html
  location / { try_files $uri $uri/ /index.html; }
}
